<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAM · Lửa cháy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial Black', 'Impact', sans-serif;
            overflow: hidden;
        }

        .fire-container {
            position: relative;
            width: 800px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 20px rgba(255, 100, 0, 0.8));
        }

        .iam-text {
            position: relative;
            font-size: 180px;
            font-weight: 900;
            letter-spacing: 20px;
            color: #fff;
            text-transform: uppercase;
            z-index: 10;
            text-shadow: 
                0 0 10px #fff,
                0 0 20px #fff,
                0 0 40px #ff8c00,
                0 0 80px #ff4500,
                0 0 120px #ff0000;
            animation: flicker 0.08s infinite alternate;
            transform: scale(1);
            transition: transform 0.3s;
            user-select: none;
            white-space: nowrap;
        }

        .iam-text:hover {
            transform: scale(1.05);
        }

        /* Lớp lửa phía sau chữ */
        .fire-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 60%, rgba(255, 100, 0, 0.7) 0%, rgba(255, 50, 0, 0.4) 30%, transparent 70%);
            filter: blur(40px);
            animation: pulse 1.5s infinite alternate;
            z-index: 1;
        }

        /* Hạt lửa bay lên */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 20;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            bottom: -20px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ffaa00;
            box-shadow: 0 0 15px #ff5500, 0 0 30px #ff0000;
            opacity: 0;
            animation: rise 2s infinite ease-out;
        }

        /* Tia lửa phụt ra hai bên */
        .spark {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffcc00;
            border-radius: 50%;
            box-shadow: 0 0 12px #ff4400;
            opacity: 0;
            animation: sparkFly 1.8s infinite;
            z-index: 25;
        }

        /* Animation chớp tắt cho chữ */
        @keyframes flicker {
            0% { opacity: 1; text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 40px #ff8c00, 0 0 80px #ff4500, 0 0 120px #ff0000; }
            25% { opacity: 0.95; text-shadow: 0 0 8px #fff, 0 0 18px #fff, 0 0 35px #ff8c00, 0 0 70px #ff4500, 0 0 100px #ff3300; }
            50% { opacity: 0.98; text-shadow: 0 0 12px #fff, 0 0 25px #fff, 0 0 50px #ffaa00, 0 0 90px #ff5500, 0 0 140px #ff2200; }
            75% { opacity: 0.92; text-shadow: 0 0 8px #fff, 0 0 20px #fff, 0 0 35px #ff8c00, 0 0 75px #ff3300, 0 0 110px #ff0000; }
            100% { opacity: 1; text-shadow: 0 0 10px #fff, 0 0 22px #fff, 0 0 45px #ff8c00, 0 0 85px #ff4500, 0 0 130px #ff0000; }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.3); opacity: 0.9; }
        }

        @keyframes rise {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.9;
            }
            100% {
                transform: translateY(-500px) scale(0.2);
                opacity: 0;
            }
        }

        @keyframes sparkFly {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* Tạo các hạt lửa với vị trí ngẫu nhiên */
        .particle:nth-child(1) { left: 10%; animation-delay: 0s; width: 8px; height: 8px; background: #ffbb00; }
        .particle:nth-child(2) { left: 20%; animation-delay: 0.4s; width: 5px; height: 5px; background: #ff8800; }
        .particle:nth-child(3) { left: 30%; animation-delay: 0.9s; width: 10px; height: 10px; background: #ffaa00; }
        .particle:nth-child(4) { left: 40%; animation-delay: 0.2s; width: 7px; height: 7px; background: #ff6600; }
        .particle:nth-child(5) { left: 50%; animation-delay: 1.1s; width: 9px; height: 9px; background: #ffcc00; }
        .particle:nth-child(6) { left: 60%; animation-delay: 0.6s; width: 6px; height: 6px; background: #ff5500; }
        .particle:nth-child(7) { left: 70%; animation-delay: 1.4s; width: 12px; height: 12px; background: #ff9900; }
        .particle:nth-child(8) { left: 80%; animation-delay: 0.3s; width: 5px; height: 5px; background: #ffaa00; }
        .particle:nth-child(9) { left: 90%; animation-delay: 0.8s; width: 8px; height: 8px; background: #ff7700; }
        .particle:nth-child(10) { left: 15%; animation-delay: 1.6s; width: 7px; height: 7px; background: #ffbb00; }
        .particle:nth-child(11) { left: 45%; animation-delay: 0.1s; width: 9px; height: 9px; background: #ff8800; }
        .particle:nth-child(12) { left: 75%; animation-delay: 1.9s; width: 6px; height: 6px; background: #ffaa00; }

        /* Tia lửa */
        .spark:nth-child(13) { left: 5%; top: 40%; --tx: -100px; --ty: -50px; animation-delay: 0s; }
        .spark:nth-child(14) { left: 95%; top: 50%; --tx: 100px; --ty: -60px; animation-delay: 0.5s; }
        .spark:nth-child(15) { left: 20%; top: 30%; --tx: -80px; --ty: 80px; animation-delay: 1.0s; }
        .spark:nth-child(16) { left: 80%; top: 70%; --tx: 90px; --ty: 40px; animation-delay: 1.5s; }
        .spark:nth-child(17) { left: 45%; top: 20%; --tx: -40px; --ty: -90px; animation-delay: 0.8s; }
        .spark:nth-child(18) { left: 55%; top: 80%; --tx: 50px; --ty: 70px; animation-delay: 1.2s; }
    </style>
</head>
<body>
    <div class="fire-container">
        <!-- Hiệu ứng lửa nền -->
        <div class="fire-glow"></div>

        <!-- Chữ IAM -->
        <div class="iam-text">IAM</div>

        <!-- Hạt lửa & tia lửa -->
        <div class="particles">
            <!-- Hạt lửa bay lên -->
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>

            <!-- Tia lửa phụt -->
            <div class="spark"></div>
            <div class="spark"></div>
            <div class="spark"></div>
            <div class="spark"></div>
            <div class="spark"></div>
            <div class="spark"></div>
        </div>
    </div>

    <script>
        // Tạo thêm hiệu ứng ngẫu nhiên cho hạt lửa (tùy chọn)
        // Tự động tạo thêm particle nếu muốn, nhưng ở đây đã có sẵn 12 hạt
        // Thêm một chút tương tác: nhấp chuột để tăng hiệu ứng lửa?
        // (Không cần thiết, nhưng làm cho trang sinh động hơn)

        // Tạo thêm hạt lửa động bằng JS để phong phú hơn
        (function addMoreParticles() {
            const container = document.querySelector('.particles');
            // Thêm 20 hạt lửa nhỏ hơn với animation delay ngẫu nhiên
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const left = Math.random() * 100;
                const delay = Math.random() * 2;
                const size = 4 + Math.random() * 8;
                const colors = ['#ffaa00', '#ff8800', '#ff5500', '#ffcc00', '#ff6600', '#ff3300'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = left + '%';
                p.style.animationDelay = delay + 's';
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.background = color;
                p.style.boxShadow = `0 0 ${10 + size}px ${color}, 0 0 ${20 + size}px #ff2200`;
                p.style.animationDuration = (1.5 + Math.random() * 2) + 's';
                container.appendChild(p);
            }

            // Thêm tia lửa ngẫu nhiên
            for (let i = 0; i < 10; i++) {
                const s = document.createElement('div');
                s.className = 'spark';
                const left = Math.random() * 100;
                const top = 20 + Math.random() * 60;
                const tx = (Math.random() - 0.5) * 200;
                const ty = (Math.random() - 0.5) * 150;
                s.style.left = left + '%';
                s.style.top = top + '%';
                s.style.setProperty('--tx', tx + 'px');
                s.style.setProperty('--ty', ty + 'px');
                s.style.animationDelay = (Math.random() * 2) + 's';
                s.style.animationDuration = (1.2 + Math.random() * 1.5) + 's';
                s.style.width = (3 + Math.random() * 5) + 'px';
                s.style.height = s.style.width;
                container.appendChild(s);
            }
        })();
    </script>
</body>
</html>
